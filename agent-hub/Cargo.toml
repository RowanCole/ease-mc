[workspace]
resolver = "2"
members = [
    "crates/server",
    "crates/gateway",
    "crates/auth",
    "crates/registry",
    "crates/agent",
    "crates/common",
    "crates/config",
    "crates/storage",
    "crates/observability",
    "crates/sdk",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
# ---------------------------------------------------------------------------
# 内部 crate
# ---------------------------------------------------------------------------
agent = { path = "crates/agent" }
auth = { path = "crates/auth" }
common = { path = "crates/common" }
config = { path = "crates/config" }
gateway = { path = "crates/gateway" }
observability = { path = "crates/observability" }
registry = { path = "crates/registry" }
sdk = { path = "crates/sdk" }
storage = { path = "crates/storage" }

# ---------------------------------------------------------------------------
# 异步运行时 / HTTP
# ---------------------------------------------------------------------------
tokio = { version = "1.0", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors", "timeout", "request-id", "compression-gzip"] }
http = "1"
http-body-util = "0.1"
futures = "0.3"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# ---------------------------------------------------------------------------
# 序列化 / 校验
# ---------------------------------------------------------------------------
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
validator = { version = "0.19", features = ["derive"] }

# ---------------------------------------------------------------------------
# 错误处理
# ---------------------------------------------------------------------------
thiserror = "2"
anyhow = "1"

# ---------------------------------------------------------------------------
# 可观测性
# ---------------------------------------------------------------------------
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
tracing-declarative = "1.1.0"
metrics = "0.23"
metrics-exporter-prometheus = "0.15"

# ---------------------------------------------------------------------------
# 认证 / 安全
# ---------------------------------------------------------------------------
jsonwebtoken = "9"
argon2 = "0.5"
secrecy = { version = "0.10", features = ["serde"] }
base64 = "0.22"
rand = "0.8"

# ---------------------------------------------------------------------------
# 存储
# ---------------------------------------------------------------------------
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "migrate"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
dashmap = "6"
parking_lot = "0.12"

# ---------------------------------------------------------------------------
# 配置 / 工具
# ---------------------------------------------------------------------------
config_rs = { package = "config", version = "0.14", default-features = false, features = ["toml", "yaml", "json"] }
dotenvy = "0.15"
uuid = { version = "1.0", features = ["v4", "v7", "serde"] }
time = { version = "0.3", features = ["serde", "serde-well-known", "formatting", "parsing", "macros"] }
url = "2"
bytes = "1"

# ---------------------------------------------------------------------------
# 测试
# ---------------------------------------------------------------------------
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
