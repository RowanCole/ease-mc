[workspace]
resolver = "2"
members = [
    "crates/mc-core",
    "crates/mc-downloader",
    "crates/mc-launcher",
    "crates/mc-assistant",
]

[workspace.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["stream"] }
tracing = "0.1"
tokio = { version = "1", features = ["fs", "io-util"] }
futures-util = "0.3"

[package]
name = "mc-starter"
version = "0.1.0"
description = "EaseMC Tauri 应用壳：窗口入口与命令转发"
authors = ["you"]
edition = "2021"

[lib]
name = "mc_starter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
dotenv = "0.15.0"
mc-core = { path = "crates/mc-core" }
mc-downloader = { path = "crates/mc-downloader" }
mc-launcher = { path = "crates/mc-launcher" }
mc-assistant = { path = "crates/mc-assistant" }
